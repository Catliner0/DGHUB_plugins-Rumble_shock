name: Sync README

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.src.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Auto Merge Markdown Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 主文件写入
          cat README.src.md > README.md
          
          # 2. 追加更新日志
          cat docs/changelog.md >> README.md
          
          # 3. 追加兼容性说明
          cat docs/compatibility.md >> README.md
          
          # 4. 过滤残留的 include 标记
          sed -i '/include/d' README.md

      - name: Commit and push if changed
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "docs: auto-sync README.md [skip ci]"
            git push
          fi
