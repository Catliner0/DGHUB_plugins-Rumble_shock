name: Sync README

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.src.md'
      - 'package.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest # 使用最新的系统环境
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5 # 升级到最新的 v5

      - name: Setup Node
        uses: actions/setup-node@v5 # 升级到最新的 v5，并自动适配系统版本
        with:
          node-version: 'latest' # 让系统自动安装最新的 Node.js

      - name: Install global tool and Build README
        run: |
          npm install -g markdown-merge # 全局安装合并工具
          markdown-merge README.src.md > README.md # 执行合并命令

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "docs: auto-sync README.md"
            git push
          fi
