name: Sync README

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.src.md'
      - 'package.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # 保持20即可，不再被强制升级

      - name: Install and Build README
        run: |
          npm install -g markdown-merge
          markdown-merge README.src.md > README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "docs: auto-sync README.md"
            git push
          fi
