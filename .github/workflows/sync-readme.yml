name: Sync README

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.src.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Auto Merge Markdown Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 使用自带的 Python 3 执行原地展开逻辑
          python3 - <<'EOF'
          import re
          import os

          with open('README.src.md', 'r', encoding='utf-8') as f:
              content = f.read()

          def replace_include(match):
              filepath = match.group(1)
              if os.path.exists(filepath):
                  with open(filepath, 'r', encoding='utf-8') as f:
                      return f.read()
              return match.group(0)  # 如果找不到文件，则保留原 include 语句

          # 原地替换 #include "路径"
          new_content = re.sub(r'#\s*include\s+"([^"]+)"', replace_include, content)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          EOF

      - name: Commit and push if changed
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "docs: auto-sync README.md [skip ci]"
            git push
          fi
