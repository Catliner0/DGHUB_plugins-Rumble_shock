name: Sync README

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.src.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Auto Merge Markdown Files
        run: |
          # 1. 创建一个空的 README.md
          touch README.md
          
          # 2. 把 README.src.md 的内容写入 README.md
          cat README.src.md >> README.md
          
          # 3. 把 docs/changelog.md 的内容追加到 README.md 后面
          cat docs/changelog.md >> README.md
          
          # 4. 打印最终生成的内容，方便我们在后台检查
          echo "Generated README.md content:"
          echo "---"
          cat README.md
          echo "---"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "docs: auto-sync README.md"
            git push
          fi
